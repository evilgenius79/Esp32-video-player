; =============================================================================
;  platformio.ini — ESP32 Video Player
;  Board  : Seeed Studio XIAO ESP32S3
;  Display: GC9A01 240×240 (Seeed Round Display for XIAO)
;  Audio  : MAX98357A via I2S
; =============================================================================

[platformio]
default_envs = xiao_esp32s3

; ─── Common settings shared by all envs ─────────────────────────────────────
[common]
platform  = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/JPEGDEC @ ^1.2.2

build_flags =
    ; Enable PSRAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Tell TFT_eSPI to use our include/User_Setup.h instead of its own
    -DUSER_SETUP_LOADED
    '-DUSER_SETUP_FILE="User_Setup.h"'
    ; Debug verbosity (0=none … 5=verbose)
    -DCORE_DEBUG_LEVEL=1
    ; Increase stack sizes if needed
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; ─── Production build ───────────────────────────────────────────────────────
[env:xiao_esp32s3]
extends = common
board   = seeed_xiao_esp32s3

; 16 MB flash: "Huge APP" leaves ~3 MB for code, rest for SPIFFS/SD
board_build.partitions  = huge_app.csv
board_build.flash_size  = 16MB
board_build.flash_mode  = qio
board_build.arduino.memory_type = qio_opi   ; activates OPI PSRAM

upload_speed   = 921600
upload_protocol = esptool

; ─── Debug build (slower, extra output) ─────────────────────────────────────
[env:xiao_esp32s3_debug]
extends = common
board   = seeed_xiao_esp32s3

board_build.partitions  = huge_app.csv
board_build.flash_size  = 16MB
board_build.arduino.memory_type = qio_opi

build_type = debug
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_AVI_PARSER
